name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fill in Supabase settings
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY under Settings > Environments > github-pages > Environment variables"
            exit 1
          fi
          mkdir _site
          sed -e "s|const SUPABASE_URL = \"\"|const SUPABASE_URL = \"$SUPABASE_URL\"|" \
              -e "s|const SUPABASE_ANON_KEY = \"\"|const SUPABASE_ANON_KEY = \"$SUPABASE_ANON_KEY\"|" \
              index.html > _site/index.html
          grep -q "const SUPABASE_URL = \"https://" _site/index.html || { echo "::error::SUPABASE_URL was not filled in"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
